# Caching rules from https://www.gatsbyjs.com/docs/caching/
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    # Hashed build assets: cache forever.
    location ~* ^/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML, page-data, app-data and the service worker: always revalidate.
    location ~* ^/(page-data/.*\.json|app-data\.json|sw\.js)$ {
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri $uri/index.html $uri.html =404;
    }
}
