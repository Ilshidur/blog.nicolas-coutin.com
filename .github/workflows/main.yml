name: Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Build + Push image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo.
        uses: actions/checkout@v4
      - name: Set up Docker Buildx.
        uses: docker/setup-buildx-action@v3
      - name: Login to the Scaleway registry.
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud/blog-nicolas-coutin-com
          username: nologin
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            rg.fr-par.scw.cloud/blog-nicolas-coutin-com/web:latest
            rg.fr-par.scw.cloud/blog-nicolas-coutin-com/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
